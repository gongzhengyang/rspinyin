name = "engine-ranking-follows-the-unigram"
[[dictionary.words]]
key = "de"
texts = [
    "的",
    "得",
]
[dictionary.unigrams]
"得" = -512
"的" = -128
[[steps]]
action = "input-char:d"
[steps.expect.candidates]
first = "d"
count = 1
contains = []
[[steps]]
action = "input-char:e"
[steps.expect.candidates]
first = "的"
count = 2
contains = ["得"]
