name = "engine-ranking-follows-the-user-frequency"
[[dictionary.words]]
key = "de"
texts = [
    "的",
    "得",
]
[[dictionary.user_words]]
text = "得"
[dictionary.user_freq]
"得" = 1000
[dictionary.unigrams]
"得" = -256
"的" = -128
[[steps]]
action = "input-char:d"
[steps.expect.candidates]
first = "d"
count = 1
contains = []
[[steps]]
action = "input-char:e"
[steps.expect.candidates]
first = "得"
count = 2
contains = ["的"]
