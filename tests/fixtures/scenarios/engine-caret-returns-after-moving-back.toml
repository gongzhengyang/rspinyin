name = "engine-caret-returns-after-moving-back"
[[dictionary.words]]
key = "ni"
texts = ["你"]
[[dictionary.words]]
key = "hao"
texts = ["好"]
[[dictionary.words]]
key = "ni'hao"
texts = ["你好"]
[[steps]]
action = "input-char:n"
[steps.expect.candidates]
first = "n"
count = 1
contains = []
[[steps]]
action = "input-char:i"
[steps.expect.candidates]
first = "你"
count = 1
contains = []
[[steps]]
action = "input-char:h"
[steps.expect.candidates]
first = "nih"
count = 1
contains = []
[[steps]]
action = "input-char:a"
[steps.expect.candidates]
first = "niha"
count = 1
contains = []
[[steps]]
action = "input-char:o"
[steps.expect.candidates]
first = "你好"
count = 1
contains = []
[[steps]]
action = "move-caret:-1"
[steps.expect.preedit]
text = "ni'hao"
caret = 3
spans = 4
[[steps]]
action = "move-caret:1"
[steps.expect.preedit]
text = "ni'hao"
caret = 6
spans = 4
