# Cargo configuration: link-time hardening.
#
# The hardening flags are stated here rather than in `[profile.release]`, which cannot
# express linker arguments, and rather than in a `RUSTFLAGS` environment variable, which
# would have to be repeated by every caller -- the developer's shell, the CI job, the
# release script -- which is exactly how two of them end up building different binaries.
# Every build reads this file, so no caller can forget the flags, and a change to them
# invalidates the build cache exactly once.
#
# The aarch64 cross-compilation settings are deliberately not here. Cargo applies
# `[target.<triple>]` to host artifacts whenever the host triple is the key
# (`target-applies-to-host` defaults to true), so a `linker` entry for
# `aarch64-unknown-linux-gnu` would also be picked up by a plain `cargo build` on an arm64
# machine -- where the build is native, the cross linker is not installed and is not
# needed, and the build would fail for a reason that has nothing to do with the machine.
# The cross linker and its emulator runner live in
# `packaging/cross/aarch64-unknown-linux-gnu.toml`, which a caller opts into with
# `--config`; the justfile's `cross-arm64` recipe does exactly that. Keeping the two paths
# apart is what lets an arm64 developer machine and the arm64 CI runner build without
# installing a cross toolchain they will never use.

# Linker hardening.
#
# The addon is dlopen'd into the user's long-lived fcitx5 process, so the hardening a
# normal CLI would get from its distribution's build flags has to be requested here
# instead -- this project ships a bare cdylib, not a packaged binary whose spec file could
# add them.
#
# `-z relro -z now` makes the GOT read-only after relocation; the load happens once at
# fcitx5 start, so the eager binding costs nothing measurable.
# `--as-needed` is already the Debian/Ubuntu default and is stated to keep the Fedora and
# Arch builds identical.
# `-z noexecstack` is a hard requirement: a shared object loaded into a desktop session's
# main process must never carry an executable stack.
#
# The flags are stated for `cfg(target_os = "linux")` rather than per triple so that they
# apply to every Linux target this workspace builds -- the host, aarch64, and whatever the
# distribution matrix adds next.
[target.'cfg(target_os = "linux")']
rustflags = [
    "-C", "link-arg=-Wl,-z,relro",
    "-C", "link-arg=-Wl,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,-z,noexecstack",
]
