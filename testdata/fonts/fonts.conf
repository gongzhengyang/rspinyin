<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Hermetic system-font database for every process cargo spawns in this
  workspace (tests included), wired in through `.cargo/config.toml`:

      [env]
      FONTCONFIG_FILE = { value = "testdata/fonts/fonts.conf", relative = true }

  Slint's software renderer resolves text through `fontdb`, which on Linux
  reads the font directories fontconfig lists. Left to the machine, that is
  the desktop's whole font set, and the rendering tests were never hermetic:
  on a workstation carrying the full Noto CJK family, fontdue's eager
  whole-file parse of the 19 MB CJK collection takes over 25 s in a debug
  build, which alone pushes every rendering test past the nextest kill
  threshold.

  The `<dir>` entries below therefore replace the system set with the fixture
  font shipped next to this file. The paths are relative to the test process's
  working directory; the three spellings cover the working directories cargo
  and nextest give test processes for the workspace's member layout
  (`crates/<crate>`, `xtask`, workspace root). A working directory outside
  those loads no font at all, which rendering tests surface as a loud failure
  rather than a machine-dependent pass.

  The prose above may not contain a double hyphen: the fontconfig parser
  fontdb uses rejects any comment carrying one, and a failed parse is
  swallowed, falling back to the machine's fonts. The long form of this
  explanation lives in `testdata/fonts/README.md`.
-->
<fontconfig>
  <dir>../../testdata/fonts</dir>
  <dir>../testdata/fonts</dir>
  <dir>testdata/fonts</dir>
</fontconfig>
