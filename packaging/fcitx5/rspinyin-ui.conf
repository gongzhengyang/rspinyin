[Addon]
Name=Rust Pinyin UI
Category=UI
Version=0.1.0
Library=librspinyin_ui
Type=SharedLibrary
OnDemand=False
Configurable=False

# UIPriority decides which UserInterface Fcitx5 activates. ClassicUI ships 0, so any
# positive value wins; the value is small and explicit so a future addon can
# deliberately outrank this one rather than depending on a tie.
UIPriority=10

# The candidate window follows a physical keyboard, not a virtual one. Declaring the
# type keeps this addon out of the way on touch-only setups, where it would have no
# cursor to follow.
UIType=PhysicalKeyboard

# Only the core is a hard dependency.
#
# The frontends must NOT be listed here. fcitx5 treats every entry in this section as
# required, so naming both `xcb` and `wayland` makes the addon refuse to load on an
# X11-only or Wayland-only system. Listing them as optional instead gets the intended
# behaviour, which is the pattern fcitx5's own cross-platform UI uses in classicui.conf.
#
# The floor must stay equal to the engine descriptor's: the two are one product, and a
# UI addon that loads where the engine does not (or the reverse) leaves the user with
# half an input method. `xtask check-versions` asserts the equality.
#
# 5.1.0 is the first release of the minor series the specification names as the runtime
# baseline. See rspinyin.conf for why the floor is not the development machine's version,
# and for the note that 5.1.0 itself has not been exercised.
[Addon/Dependencies]
0=core:5.1.0

[Addon/OptionalDependencies]
0=xcb
1=wayland

[Dependencies]
