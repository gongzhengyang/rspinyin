[Addon]
Name=Rust Pinyin
Category=InputMethod
Version=0.1.0
Library=librspinyin
Type=SharedLibrary
OnDemand=False
Configurable=True

# Only the core is a hard dependency.
#
# The frontends must NOT be listed here. fcitx5 treats every entry in this section as
# required, so naming both `xcb` and `wayland` makes the plugin refuse to load on an
# X11-only or Wayland-only system — verified against fcitx5 5.1.7: disabling either one
# suppresses the addon entirely. Listing them as optional instead gets the intended
# behaviour (load after whichever frontend is present, tolerate its absence), which is
# the pattern fcitx5's own cross-platform UI uses in classicui.conf.
#
# The floor is 5.1.0: the first release of the minor series the specification names as
# the runtime baseline, not the version the development machine happens to run. Every
# entry in this section is a *required* dependency — fcitx5 suppresses the whole addon
# when one is unmet — so an over-tight floor removes the plugin silently instead of
# reporting anything, which is exactly what a floor pinned to the development machine
# (5.1.7) did to every user below it.
#
# 5.0.x (Ubuntu 22.04 LTS) is deliberately below this floor. A compatible build against
# 5.0.x is a separate decision; until it is taken, nothing here claims that series.
#
# NOT VERIFIED ON 5.1.0: 5.1.7 is the only version this build has been loaded on. The
# floor states the specification's baseline; it is not a measurement. The runtime guards
# are what cover the difference — a host whose platform layout differs is reported as
# `platform/fcitx5/version-mismatch` and `platform/modifier-mask-mismatch` at load.
[Addon/Dependencies]
0=core:5.1.0

[Addon/OptionalDependencies]
0=xcb
1=wayland

[Dependencies]
