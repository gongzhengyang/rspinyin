[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The fuzz crate needs nightly and its own profile; keep it out of the main
# workspace so `cargo check --workspace` stays on the stable toolchain.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["rspinyin contributors"]
repository = "https://github.com/rspinyin/rspinyin"
description = "Offline-first Chinese pinyin input method for Linux (in-process Fcitx5 addon with a self-drawn candidate window)"

[workspace.dependencies]
# ── 内部 crate（依赖方向见 docs/dev/features.md 0.4 规则 1）──────────────
ime-types = { path = "crates/ime-types" }
ime-core = { path = "crates/ime-core" }
ime-dict = { path = "crates/ime-dict" }
ime-config = { path = "crates/ime-config" }
ime-ui = { path = "crates/ime-ui" }
ime-diag = { path = "crates/ime-diag" }

# ── 契约层（ime-types 只允许依赖这三个）────────────────────────────────
thiserror = "2"                                                        # 错误类型派生
bitflags = "2"                                                         # DecodeFlags 位标志
serde = { version = "1", features = ["derive"] }                       # 配置/词源清单序列化

# ── 核心引擎 ───────────────────────────────────────────────────────────
smallvec = "1"                                                         # 音节切分 DAG 的每节点边表（≤8 边零堆分配）

# ── 词库层 ─────────────────────────────────────────────────────────────
fst = "0.4"                                                            # 音节串 → 词表区间的 FST 索引
crc32fast = "1"                                                        # 词库段与文件级 CRC32 校验
memmap2 = "0.9"                                                        # base.dict 只读 mmap 零拷贝加载

# ── 工程工具 ───────────────────────────────────────────────────────────
anyhow = "1"                                                           # xtask / 脚本宿主
clap = { version = "4", features = ["derive"] }                        # xtask 子命令
serde_json = "1"                                                       # budgets.json 读写
toml = "0.9"                                                           # data/sources.toml 白名单解析
sha2 = "0.10"                                                          # 词源 SHA256 校验
pkg-config = "0.3"                                                     # ime-fcitx5/build.rs 探测 Fcitx5
cc = "1"                                                               # ime-fcitx5/build.rs 编译 C++ 胶水

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# `strip` is deliberately NOT set here, in any form — `strip = true` and
# `strip = "symbols"` both make rustc pass `--strip-all` to the linker, which drops `fcitx_addon_factory_instance` from the
# dynamic symbol table — the symbol Fcitx5 resolves with dlsym after dlopen, and
# whose absence produces a library that loads but contains no addon. Stripping for
# the size budget happens at packaging time instead, where it can be verified
# against `nm -D` before the artifact ships.
# 注意：不得设置 `panic = "abort"`。2.2.3 要求所有 `extern "C"` 边界用
# `std::panic::catch_unwind` 兜底（跨 FFI 边界 unwind 是 UB），而 abort 会让
# catch_unwind 无法捕获。
