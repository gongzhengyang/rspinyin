# rspinyin CI baseline.
#
# `just ci` is the whole gate suite (AGENTS.md section 2, features.md 0.3), and no job
# here writes that set down again: `quality` runs `just ci` and nothing else, and the
# jobs that run what the suite cannot -- a scan that needs the network, the host-ABI
# half -- call the single recipe that owns it. A gate listed in this file but not in
# the justfile is one nobody can run locally, and one listed in the justfile but not
# here is one nobody enforces; the audit job's hand-written recipe list was exactly
# that drift, and it is why the list now lives in one place.
#
# The release jobs (`reproducible`, `dictionary`, `size`) build and verify artifacts
# rather than audit the tree, so they are not part of `just ci`; each asserts its own
# artifact inline and reports a stable `dist/verify/...` code on failure.
#
#   quality       `just ci` -- the full gate suite, on a machine without the Fcitx5
#                 development packages, so the pure-Rust path is proven. The
#                 host-ABI half of the suite reports a skip here; the next job is
#                 where it actually runs.
#   host-abi      `just check-host`, the host-ABI half of that same suite, with
#                 RSPINYIN_REQUIRE_HOST_ABI=1 so that a missing development package
#                 fails instead of skipping; this is where the half `quality` had to
#                 skip actually runs
#   cross-arch    the aarch64 channel: `just check-arm64` builds both addons and runs
#                 the host-ABI half of the suite on a native arm64 runner, so the
#                 architecture claim rests on the code running rather than on the
#                 files existing
#   audit         the advisory scan, which needs the network and is therefore the
#                 one gate `just ci` excludes; the architecture and licence audits
#                 run in `quality` as part of the suite
#   bench         budget regression; only on main and on PRs labelled `bench`
#   reproducible  two clean release builds of one commit must agree byte for byte,
#                 and the hardened link must be visible in the ELF headers
#   dictionary    the dictionary build: the raw sources are cached, the compile is
#                 asserted to need no network and to be byte-for-byte reproducible,
#                 and the result is uploaded as the artifact a release packages
#   size          the packaged release against the size budgets and the delivery
#                 contract: stripped, exporting the addon factory, and matching the
#                 manifest it ships with
#
# `--all-features` is never passed to the workspace as a whole: it would turn on
# `ime-fcitx5/fcitx5-host` and `ime-ui-addon/fcitx5-host`, whose build scripts
# abort when pkg-config cannot find the Fcitx5 development packages. `just ci`
# encodes that split -- the two addon crates are gated on their default feature
# set, and the C ABI link lives in `just check-host`, which the suite includes.
#
# The audit scripts are bash + python3 (shipped by the runner image), and
# `just`/`cargo-nextest`/`cargo-audit`/`cargo-deny`/`cargo-public-api` come from
# prebuilt binaries so the quality job stays inside its cold-cache budget.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reproducible builds: the timestamp embedded in the C++ glue's debug info and in any
  # __DATE__/__TIME__ expansion must not depend on when the job ran. It is also the epoch
  # `xtask package` stamps the archive's members and the release manifest with, so the two
  # records of when a release was built cannot disagree.
  SOURCE_DATE_EPOCH: 1790899200
  # The `cc` crate reads CXXFLAGS, so the prefix map reaches the C++ glue without touching
  # build.rs. It rewrites absolute build paths to a stable token, which is what makes two
  # builds of the same tree byte-identical.
  CXXFLAGS: "-ffile-prefix-map=${{ github.workspace }}=. -fdebug-prefix-map=${{ github.workspace }}=."

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    # The full suite, as one recipe. The Fcitx5 development packages are deliberately
    # not installed here -- a host-ABI build in this job would mean the dependency-free
    # path had stopped being dependency-free -- so `just ci` reports the host-ABI half
    # as skipped and the `host-abi` job is where it runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Install cargo-public-api for the Slint-leak audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: Install the nightly toolchain for the public-API audit
        # `just check-slint` drives `cargo public-api`, which needs a nightly
        # rustdoc. The workspace build itself stays on the toolchain pinned by
        # rust-toolchain.toml; this only gives that one audit its compiler.
        run: rustup toolchain install nightly --profile minimal
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run the full gate suite
        run: just ci

  host-abi:
    name: host-abi
    runs-on: ubuntu-24.04
    # The host-ABI half of `just ci`, which `quality` cannot run because it has no
    # Fcitx5 development packages. The two jobs are complementary halves of the same
    # suite rather than one nested in the other: the suite's self-tests bind sockets and
    # spawn helper processes, and running them on two runners per pull request would
    # double their flake surface without adding a single assertion.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install the Fcitx5 development packages
        # All three, not just Fcitx5Core: the build scripts probe
        # Fcitx5Core, Fcitx5Utils and Fcitx5Config before compiling the glue.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Lint, test and doctest with the real C ABI linked
        # `just check-host` is the host-ABI half of `just ci`, so the suite still has
        # one definition. RSPINYIN_REQUIRE_HOST_ABI=1 makes the Fcitx5 development
        # packages a hard requirement: without it a runner whose apt install silently
        # failed would report a skip and the job would pass having proved nothing.
        run: RSPINYIN_REQUIRE_HOST_ABI=1 just check-host

  cross-arch:
    name: cross-arch
    # The aarch64 channel, on GitHub's native arm64 image. `just check-arm64` builds
    # both addons and runs the host-ABI half of the suite, and the recipe refuses to
    # run anywhere but arm64 -- which is what keeps a mislabelled runner from passing
    # this job with an x86_64 binary.
    #
    # The runner is not interchangeable with the x86_64 one. Both addons are cdylibs
    # that link against arm64 `libFcitx5Core.so.7` and `libFcitx5Utils.so.2`, so a
    # cross build would have to assemble a complete arm64 Fcitx5 sysroot first and
    # would then run its tests under `qemu-aarch64`. The distribution's own arm64
    # archive supplies the development packages here instead, and the C++ glue
    # compiles against the same headers as every other job. The cross path is kept
    # for developers (`just cross-arm64`); it is not what this job proves.
    #
    # If the repository's plan does not offer arm64 runners this job queues instead of
    # failing, which reads as "pending" rather than as "the architecture is not
    # covered". It must then be replaced -- the emulated `docker/setup-qemu-action@v3`
    # path, with the container image pinned by digest -- or deleted, with aarch64
    # marked unsupported in the delivery matrix. Leaving it queued is the one option
    # that lies about the coverage.
    #
    # Longer than the `host-abi` job it mirrors: `check-arm64` builds the release
    # artifacts and then the test profile, and the release profile is LTO with a
    # single codegen unit.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the Fcitx5 development packages
        # All three, for the same reason as the `host-abi` job: the build scripts
        # probe Fcitx5Core, Fcitx5Utils and Fcitx5Config before compiling the glue.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build for aarch64 and run the host-ABI gates
        run: just check-arm64
      - name: Record the measured sizes
        # Not a gate -- `just check-arm64` already asserted both artifacts -- but an
        # aarch64 artifact is not the same size as its x86_64 twin, and the size
        # budget is only meaningful next to the number that was measured.
        run: |
          {
            echo "### aarch64 artifacts"
            echo
            echo '| file | bytes |'
            echo '|---|---|'
            for library in target/release/librspinyin.so target/release/librspinyin_ui.so; do
              printf '| %s | %s |\n' "$(basename "$library")" "$(stat -c%s "$library")"
            done
            echo
            echo '```'
            size target/release/librspinyin.so target/release/librspinyin_ui.so
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the aarch64 addons
        # The handoff to packaging: an aarch64 `.deb`/`.rpm`/`PKGBUILD` needs these two
        # files, and rebuilding them in that job would be a second definition of what
        # this architecture builds.
        uses: actions/upload-artifact@v4
        with:
          name: rspinyin-aarch64-addons
          path: |
            target/release/librspinyin.so
            target/release/librspinyin_ui.so
          retention-days: 30

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install just, cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit,cargo-deny
      - name: Scan the dependency closure for advisories and licence drift
        # The one gate `just ci` excludes, and the reason this job exists at all:
        # `cargo audit` contacts the registry to check whether a version has been
        # yanked, so it cannot sit in a suite that has to pass on a machine with no
        # network. Every other architecture, licence, budget and self-test audit runs
        # in the `quality` job as part of `just ci` -- naming them again here would be
        # a second definition of the suite, and the two would drift apart.
        #
        # `deny.toml` carries the licence policy and the written exemptions;
        # `.cargo/audit.toml` carries the advisory exemption and its reason.
        run: just check-advisories

  bench:
    name: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'bench')
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run the benchmarks
        run: just bench-quick

  reproducible:
    name: reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Fcitx5 development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build both addons
        run: |
          cargo build --release -p ime-fcitx5 --features fcitx5-host
          cargo build --release -p ime-ui-addon --features fcitx5-host
      - name: Record the first digests
        run: |
          mkdir -p target/reproducible
          sha256sum target/release/librspinyin.so target/release/librspinyin_ui.so \
            | tee target/reproducible/first.sha256
      - name: Build again from a clean tree
        run: |
          cargo clean -p ime-fcitx5 -p ime-ui-addon
          cargo build --release -p ime-fcitx5 --features fcitx5-host
          cargo build --release -p ime-ui-addon --features fcitx5-host
      - name: Assert the two builds agree
        run: |
          sha256sum --check target/reproducible/first.sha256 \
            || { echo "dist/verify/build-not-reproducible: two builds of the same commit differ" >&2; exit 1; }
      - name: Assert the hardening flags took effect
        # Both libraries, not just the engine: the UI addon links Slint and is the larger
        # of the two, so it is the one a missing `-z relro` would matter most for.
        run: |
          for library in target/release/librspinyin.so target/release/librspinyin_ui.so; do
            readelf -lW "$library" | grep -q 'GNU_RELRO' \
              || { echo "dist/verify/no-relro: $library was linked without GNU_RELRO" >&2; exit 1; }
            readelf -dW "$library" | grep -q 'BIND_NOW' \
              || { echo "dist/verify/no-bind-now: $library was linked without -z now" >&2; exit 1; }
          done

  dictionary:
    name: dictionary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Restore the raw dictionary sources
        id: raw
        uses: actions/cache@v4
        with:
          path: data/raw
          # The key covers the pinned allowlist *and* the derived sources that live in the
          # same directory and are committed. `data/sources.toml` alone would not do: the
          # committed `base.tsv` and `polyphone.tsv` change independently of it, and a
          # restore overwrites what the checkout put there, so a key that ignored them
          # could silently compile an older word list than the commit under test.
          # data/fetch.sh re-verifies whatever was restored against the digests, so a
          # restored fetched file is checked rather than trusted.
          key: dict-raw-${{ hashFiles('data/sources.toml', 'data/raw/base.tsv', 'data/raw/polyphone.tsv') }}
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Fetch the sources
        # On a cache hit this is a verification pass: every source that already matches
        # its pin is left alone and only a missing or mismatched one is downloaded.
        run: bash data/fetch.sh
      - name: Compile the dictionary
        id: compile
        run: |
          started=$(date +%s)
          cargo run --quiet -p xtask -- dictc
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
      - name: Assert the dictionary rebuilds offline and byte for byte
        # This is the build-time half of the zero-network promise, which is a different
        # claim from the runtime one BUDGET-NET-01 makes: the compile must not reach the
        # network even though it runs on a machine that has one. CARGO_NET_OFFLINE covers
        # cargo, and the proxy variables are unset so a source cannot be refreshed by
        # accident through one of them. Reproducibility is asserted in the same step: the
        # digest a release manifest records is only worth recording if the same inputs
        # produce the same bytes, and a release ships this file.
        run: |
          set -eu
          first="$(sha256sum data/compiled/base.dict | cut -d' ' -f1)"
          rm -f data/compiled/base.dict
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            CARGO_NET_OFFLINE=true \
            cargo run --quiet -p xtask -- dictc
          second="$(sha256sum data/compiled/base.dict | cut -d' ' -f1)"
          test "$first" = "$second" \
            || { echo "dist/verify/dict-not-reproducible: $first != $second" >&2; exit 1; }
          echo "the dictionary rebuilds from the cached sources with no network: $second"
      - name: Upload the compiled dictionary
        uses: actions/upload-artifact@v4
        with:
          name: base-dict
          path: data/compiled/base.dict
          retention-days: 30
      - name: Assert the installer takes a prebuilt dictionary
        # A smoke check rather than the end-to-end one: actually staging a dictionary
        # needs the Fcitx5 development packages to resolve the destination layout, and
        # this job deliberately does not install them. What is asserted is that the option
        # is parsed before anything else runs, and that a value-less `--dict` is a usage
        # error instead of a silent fallback to compiling a dictionary nobody asked for.
        # The install job exercises the staging path itself.
        run: |
          set -eu
          bash packaging/install.sh --help | grep -q -- '--dict PATH'
          status=0
          bash packaging/install.sh --dict >/dev/null 2>&1 || status=$?
          test "$status" -eq 2 \
            || { echo "dist/verify/dict-option-not-refused: exit $status" >&2; exit 1; }
      - name: Record the cache and the build time
        # `always()` so that a failed or slow build still reports its figures: the point
        # of the record is to make a cache that stopped hitting, or a build that doubled
        # in cost, visible in the pull request rather than only in the job log.
        if: always()
        run: |
          size="$(stat -c%s data/compiled/base.dict 2>/dev/null || echo 'not built')"
          {
            echo "### Dictionary build"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| raw-source cache | ${{ steps.raw.outputs.cache-hit == 'true' && 'hit' || 'miss' }} |"
            echo "| compile time | ${{ steps.compile.outputs.seconds || 'n/a' }}s |"
            echo "| base.dict | ${size} |"
          } >> "$GITHUB_STEP_SUMMARY"

  size:
    name: size
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Fcitx5 development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
      - name: Restore the raw dictionary sources
        # Restore only: the `dictionary` job owns this cache key, and two jobs saving the
        # same key would race for it. The key is shared so that a run which already built
        # the dictionary here re-verifies the digests instead of downloading again; it
        # must stay identical to the one in the `dictionary` job.
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: dict-raw-${{ hashFiles('data/sources.toml', 'data/raw/base.tsv', 'data/raw/polyphone.tsv') }}
      - name: Build the dictionary
        # A release carries base.dict, so the job has to produce one. The raw sources are
        # fetched rather than committed, which is why this step needs the network on a
        # cold cache; `xtask package` then requires the file rather than skipping it.
        run: |
          bash data/fetch.sh
          cargo run --quiet -p xtask -- dictc
      - name: Build and package the addons
        run: just package
      - name: Assert the archive carries the input method's icons
        # The packager already refuses to plan a release without them, and the manifest
        # step below would notice a payload that never made it into the archive. This
        # checks the archive itself, because the promise is about what a user unpacks:
        # Fcitx5 resolves `Icon=fcitx-rspinyin` through the hicolor theme, so an archive
        # without these two files installs an input method with a blank icon.
        run: |
          for icon in fcitx-rspinyin.png fcitx-rspinyin.svg; do
            tar -tzf dist/rspinyin-*.tar.gz | grep -q "/${icon}\$" \
              || { echo "dist/verify/icon-missing: the archive carries no ${icon}" >&2; exit 1; }
          done
      - name: Assert the size budgets
        # The recipe, not the `cargo run` behind it: a gate this file spells out for
        # itself is a second definition of the gate, and the two drift.
        run: just check-size
      - name: Assert what left the repository is stripped and still loadable
        # The packager checks both of these itself, with its own ELF reader. This step
        # checks them again with binutils, because the promise is about the file rather
        # than about the tool that produced it.
        run: |
          for library in dist/librspinyin.so dist/librspinyin_ui.so; do
            if file "$library" | grep -q 'not stripped'; then
              echo "dist/verify/not-stripped: $library left the repository unstripped" >&2
              exit 1
            fi
            nm -D --defined-only "$library" | grep -q 'fcitx_addon_factory_instance' \
              || { echo "dist/verify/factory-symbol-missing: $library exports no addon factory" >&2; exit 1; }
          done
      - name: Verify the manifest and the checksum list against the release
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json, pathlib

          release = pathlib.Path("dist")
          manifest = json.loads((release / "rspinyin-release.json").read_text())
          for artifact in manifest["artifacts"]:
              path = release / artifact["name"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == artifact["sha256"], (artifact["name"], digest)
              assert path.stat().st_size == artifact["size_bytes"], artifact["name"]
          print(f"manifest: {len(manifest['artifacts'])} artifacts match their recorded digests")
          PY
      - name: Record the measured sizes
        run: |
          {
            echo "### Release artifact sizes"
            echo
            echo 'A size budget is a ceiling, not a target. `base.dict` measures the'
            echo 'dictionary content, which is still being filled in: a value far below'
            echo 'the ceiling means the dictionary is incomplete, not that the artifact'
            echo 'is small.'
            echo
            echo '| file | bytes |'
            echo '|---|---|'
            find dist -maxdepth 1 -type f -printf '| %f | %s |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: rspinyin-release
          path: dist/
