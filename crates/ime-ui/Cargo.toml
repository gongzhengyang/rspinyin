rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rspinyin view layer: Slint platform integration, software rasterizer, candidate window geometry and animation"

[dependencies]
ime-types.workspace = true
ime-config.workspace = true
slint.workspace = true
rustix.workspace = true
x11rb.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
