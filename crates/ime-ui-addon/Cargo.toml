[package]
name = "ime-ui-addon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rspinyin user-interface addon: the Fcitx5 UserInterface glue and the self-drawn candidate window's host side"
build = "build.rs"

[lib]
# Artifact name is `rspinyin_ui`, so the cdylib is `librspinyin_ui.so` — the second
# addon ADR-0003 requires. Fcitx5 picks the active user interface from the addons it
# discovered with `Category=UI`, and an addon belongs to exactly one category, so the
# engine addon cannot also be the UI. The package keeps its `ime-ui-addon` identity for
# the workspace dependency graph.
#
# The underscore is not cosmetic: Cargo rejects a `[lib] name` containing a hyphen
# (`error: library target names cannot contain hyphens`), and Fcitx5 resolves the
# descriptor's `Library=` verbatim plus `.so`. ADR-0004 decision 4 records the
# correction from ADR-0003's `librspinyin-ui.so` spelling.
name = "rspinyin_ui"
# cdylib: dlopen'd by fcitx5 as its own addon, independently of librspinyin.so.
# rlib: lets integration tests link the Rust side.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Links against the real fcitx5 C ABI, which needs `libfcitx5core-dev`. With it off
# only the Rust side is compiled, so the pure-Rust CI job needs no Fcitx5 development
# package and stays dependency-free.
#
# This is the one deliberate exception to `--all-features` (AGENTS.md section 3.1):
# the pure-Rust gates exclude this crate instead of enabling the feature, and the
# host-ABI path is exercised separately by `just check-host`.
fcitx5-host = []

[dependencies]
ime-types.workspace = true
ime-config.workspace = true
ime-ui.workspace = true
ime-diag.workspace = true

[build-dependencies]
pkg-config.workspace = true
cc.workspace = true

[lints]
workspace = true
