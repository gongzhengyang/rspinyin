# The Ziranma double-pinyin layout, as data.
#
# Source: `double_pinyin.schema.yaml` in the Rime double-pinyin schema package
# (github.com/rime/rime-double-pinyin), cross-checked against the
# `double_pinyin_zrm_sheng` / `double_pinyin_zrm_yun` arrays of libpinyin's
# `src/storage/double_pinyin_table.h` (github.com/libpinyin/libpinyin). The two
# agree on every key. The layout most later schemes were derived from.
#
# Known limitation: `uo` and `o` share the `o` key, and the syllable table holds
# both `luo` and `lo`. The finals below list `uo` before `o`, so the mapping
# resolves the pair to `luo`, the far more common reading; `lo` is not reachable
# through this layout.

[layout]
name = "自然码"
# The first-letter school, the same rule Xiaohe uses: `a` is `aa`, `ai` is `al`,
# `an` is `aj`, `ang` is `ah`, `ao` is `ak`, `e` is `ee`, `en` is `ef`, `eng` is
# `eg`, `o` is `oo`, `ou` is `ob`. `er` keeps its two letters, since no key
# carries it.
zero_initial_style = "first-letter"

# Key -> the syllable initial the key opens a syllable with. `zh` on `v`, `ch`
# on `i`, `sh` on `u`, as in Xiaohe.
[initials]
a = "a"
b = "b"
c = "c"
d = "d"
e = "e"
f = "f"
g = "g"
h = "h"
i = "ch"
j = "j"
k = "k"
l = "l"
m = "m"
n = "n"
o = "o"
p = "p"
q = "q"
r = "r"
s = "s"
t = "t"
u = "sh"
v = "zh"
w = "w"
x = "x"
y = "y"
z = "z"

# Key -> the syllable finals the key closes a syllable with, in trial order,
# space-separated. The keys that differ from Xiaohe are the interesting ones:
# `l` is `ai` there and `d` is `ai` here, and `ing` sits on `y` rather than on
# `k`.
[finals]
a = "a"
b = "ou"
c = "iao"
d = "uang iang"
e = "e"
f = "en"
g = "eng ng"
h = "ang"
i = "i"
j = "an"
k = "ao"
l = "ai"
m = "ian"
n = "in"
o = "uo o"
p = "un"
q = "iu"
r = "uan er"
s = "ong iong"
t = "üe ue"
u = "u"
v = "ü ui"
w = "ia ua"
x = "ie"
y = "uai ing"
z = "ei"

# Key -> the syllable the key spells on its own.
[standalone]
a = "a"
e = "e"
o = "o"
