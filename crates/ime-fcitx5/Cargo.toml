[package]
name = "ime-fcitx5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rspinyin host integration layer: C ABI glue for the Fcitx5 Addon / InputMethodEngine / UserInterface"
build = "build.rs"

[lib]
# Artifact name is `rspinyin`, so the cdylib is `librspinyin.so` — the name Fcitx5
# loads and the name the acceptance criteria assert on. The package keeps its
# `ime-fcitx5` identity for the workspace dependency graph.
name = "rspinyin"
# cdylib: dlopen'd by fcitx5. rlib: lets integration tests link the Rust side.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 启用真实 fcitx5 C ABI 链接（需要 libfcitx5core-dev）。关闭时只编译 Rust 侧
# 逻辑与 MockHost，使 CI 的纯 Rust job 无需 Fcitx5 开发包。
fcitx5-host = []

[dependencies]
ime-types.workspace = true
ime-core.workspace = true
ime-dict.workspace = true
ime-config.workspace = true
ime-ui.workspace = true
ime-diag.workspace = true

[build-dependencies]
pkg-config.workspace = true
cc.workspace = true

[lints]
workspace = true
