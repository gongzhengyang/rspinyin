[package]
name = "ime-fcitx5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rspinyin host integration layer: C ABI glue for the Fcitx5 Addon / InputMethodEngine / UserInterface"
build = "build.rs"

[lib]
# Artifact name is `rspinyin`, so the cdylib is `librspinyin.so` — the name Fcitx5
# loads and the name the acceptance criteria assert on. The package keeps its
# `ime-fcitx5` identity for the workspace dependency graph.
name = "rspinyin"
# cdylib: dlopen'd by fcitx5. rlib: lets integration tests link the Rust side.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Links against the real fcitx5 C ABI, which needs `libfcitx5core-dev`. With it off
# only the Rust side and the mock host are compiled, so the pure-Rust CI job needs no
# Fcitx5 development package and stays dependency-free.
#
# This is the one deliberate exception to `--all-features` (AGENTS.md section 3.1):
# the pure-Rust gates exclude this crate instead of enabling the feature, and the
# host-ABI path is exercised separately by `just check-host`.
fcitx5-host = []

[dependencies]
ime-types.workspace = true
ime-core.workspace = true
ime-dict.workspace = true
ime-config.workspace = true
ime-diag.workspace = true
# `ime-ui` is deliberately absent: the candidate window belongs to the
# user-interface addon (`crates/ime-ui-addon`), which is a separate cdylib loaded by
# Fcitx5 as its own addon. Declaring it here linked nothing and let the linker drop
# the whole view layer, so the shipped library contained no renderer at all.

[build-dependencies]
pkg-config.workspace = true
cc.workspace = true

[lints]
workspace = true
