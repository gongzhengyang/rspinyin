[package]
name = "ime-diag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rspinyin diagnostics layer: structured logging, crash capture, performance probes and budget dashboard"

[dependencies]
ime-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
signal-hook.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
# The frame-mirror codec (schema + writer): test-harness tooling, so serde and
# serde_json only enter this crate's build when a harness enables the feature.
uiframe = ["dep:serde", "dep:serde_json", "dep:thiserror"]

[lints]
workspace = true
