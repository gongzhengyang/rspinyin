# rspinyin dictionary source allowlist.
#
# ADR-0000 decision 2: base.dict may only be built from sources that carry an
# open, permissive licence, so the derived database stays distributable under
# MIT OR Apache-2.0. `dictc` refuses to compile a source that is not registered
# here, and scripts/check-dict-sources.sh enforces the same list in CI.
#
# Field rules:
#   * `id`        file name stem: the raw file is data/raw/<id>.tsv
#   * `spdx`      machine-readable identifier, validated against the permissive
#                 allowlist (MIT / Apache-2.0 / BSD / ISC / Unicode / CC0)
#   * `license`   human-readable label; must not name a copyleft licence
#   * `sha256`    pins the downloaded file. Empty until the file is fetched:
#                 the moment data/raw/<id>.tsv exists, CI fails until the hash
#                 recorded here matches, so an unfinished entry cannot pass.
#                 Compute it with: sha256sum data/raw/<id>.tsv
#   * `retrieved` download date, YYYY-MM-DD; required once the file is present
#   * `kind`      `upstream` (hash-pinned download) or `derived` (generated by
#                 this project from whitelisted sources, exempt from pinning
#                 because it changes whenever the generator changes)
#   * `layer`     ADR-0000 layer: L1 single characters, L2 words, L3 word
#                 readings, L4 frequencies, L5 domain vocabulary
#
# Excluded by ADR-0000; do not add:
#   luna-pinyin (LGPL-3.0), CC-CEDICT (CC BY-SA 4.0), the commercial
#   dictionaries of Sogou/Baidu/QQ, research-only word lists, and the Tencent
#   embedding word list (licence unresolved; see ADR-0012 W-4). THUOCL and the
#   huayu word list were lifted from this list by ADR-0012 (accepted
#   2026-10-14).
#
# Corpus inputs (raw text consumed only to derive statistics, never committed
# and never distributed) are NOT word sources: they are governed by
# ADR-0012 decision 2, not by this allowlist. Derived artifacts produced from
# such a corpus (`kind = "derived"`) stay pin-exempt under the same rule as
# any generated file.

[[source]]
id = "pinyin-data"
kind = "upstream"
layer = "L1"
url = "https://github.com/mozillazg/pinyin-data"
license = "MIT"
spdx = "MIT"
retrieved = "2026-09-29"
# The committed copy is the upstream download consumed by the build.
sha256 = "ec888380a88f317e8ae6f90e8fc2d26207e258c1aa3f9f3b4cb4b34732063f6c"
permissive = true

